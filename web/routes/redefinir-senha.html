    <script id="tirar-token-apple-da-url">
        // Login com Apple: o id_token chega no fragmento (/login-apple#id_token=...) e vale como senha até vencer.
        // Ele sai da URL ANTES de qualquer outro script (terceiros, telemetria de erros, roteador) ler a location,
        // e fica na sessionStorage da aba até a tela do login com Apple usá-lo (src/utils/idTokenDaUrl.ts): um F5
        // antes disso ainda o envia, e o uso único o queima.
        (function () {
            try {
                if (location.pathname !== '/login-apple') return;
                var token = new URLSearchParams(location.hash.slice(1)).get('id_token')
                    || new URLSearchParams(location.search).get('id_token');
                if (token) {
                    try { sessionStorage.setItem('siga:id-token-apple', token); } catch (e) { window.__sigaIdTokenApple = token; }
                }
                if (location.hash || location.search) history.replaceState(null, '', location.pathname);
            } catch (e) {
                // sem URLSearchParams ou history: a tela do login com Apple tira o token da URL
            }
        })();
    </script>
